<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Splitter</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f5f2;
      --ink: #1c1b19;
      --muted: #5e5a54;
      --line: #ddd8cf;
      --card: #fff;
      --ok: #1f6b45;
      --bad: #8d2b2b;
      --accent: #1c1b19;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 "Iowan Old Style", Palatino, Georgia, serif;
      background: var(--bg);
      color: var(--ink);
    }
    main { max-width: 760px; margin: 0 auto; padding: 40px 20px 64px; }
    h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.02em; }
    h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 10px; }
    p.lead { margin: 0 0 28px; color: var(--muted); }
    section { background: var(--card); border: 1px solid var(--line); padding: 18px 18px 16px; margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    code, button, textarea, table { font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
    textarea {
      width: 100%; min-height: 160px; resize: vertical;
      border: 1px solid var(--line); padding: 10px; background: #fff; color: var(--ink);
    }
    .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    button {
      border: 1px solid var(--accent); background: var(--accent); color: #fff;
      padding: 8px 14px; cursor: pointer;
    }
    button.ghost { background: #fff; color: var(--ink); }
    button:disabled { opacity: 0.4; cursor: default; }
    .stats { display: flex; gap: 22px; margin: 0 0 12px; }
    .stats strong { display: block; font-size: 22px; font-weight: 600; }
    .stats span { color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    ul { margin: 8px 0 0; padding-left: 18px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Splitter</h1>
    <p class="lead">Read a clip table. Write one fixed leave-one-person-out split file.</p>

    <section>
      <h2>1 · Table</h2>
      <label for="csv">Paste CSV, or drop a file. The header must be exactly <code>id,person,label</code>.</label>
      <textarea id="csv" placeholder="id,person,label&#10;01-0,01,happy&#10;02-0,02,sad"></textarea>
      <div class="actions">
        <button class="ghost" id="example" type="button">Load example</button>
        <button id="run" type="button">Write splits</button>
      </div>
    </section>

    <section id="result" class="hidden">
      <h2>2 · Splits</h2>
      <div id="summary" class="stats hidden">
        <div><strong id="n-clips">0</strong><span>clips</span></div>
        <div><strong id="n-people">0</strong><span>people</span></div>
        <div><strong id="n-splits">0</strong><span>splits</span></div>
      </div>
      <p id="check"></p>
      <ul id="errors"></ul>
      <table id="fold-table" class="hidden">
        <thead>
          <tr><th>Left out</th><th class="num">Train clips</th><th class="num">Test clips</th></tr>
        </thead>
        <tbody id="folds"></tbody>
      </table>
      <div class="actions">
        <button id="download" type="button" disabled>Download splits.json</button>
      </div>
    </section>
  </main>
  <script>
    const REQUIRED = ["id", "person", "label"];
    const EXAMPLE = `id,person,label
01-0,01,happy
01-1,01,sad
02-0,02,happy
02-1,02,calm
03-0,03,sad
03-1,03,happy
04-0,04,calm
04-1,04,sad`;

    const csvEl = document.getElementById("csv");
    const resultEl = document.getElementById("result");
    let lastJson = null;

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      let rowStart = 1;
      const quoteRows = [];
      const src = String(text).replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      for (let i = 0; i < src.length; i++) {
        const ch = src[i];
        if (quoted) {
          if (ch === '"') {
            if (src[i + 1] === '"') { cell += '"'; i++; }
            else quoted = false;
          } else cell += ch;
        } else if (ch === '"') {
          if (cell !== "") {
            return { error: `Row ${rows.length + 1}: a quote appears in the middle of a value. Wrap the whole value in quotes.` };
          }
          quoted = true;
          quoteRows.push(rows.length + 1);
        } else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n") {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
          if (quoted) {
            return { error: `Row ${rowStart}: a quoted value was opened and never closed.` };
          }
          rowStart = rows.length + 1;
        } else cell += ch;
      }
      if (quoted) {
        return { error: `Row ${rowStart}: a quoted value was opened and never closed.` };
      }
      if (cell.length || row.length) {
        row.push(cell);
        rows.push(row);
      }
      return { rows };
    }

    function headerError(headers) {
      const trimmed = headers.map((h) => h.trim());
      if (trimmed.some((h) => h === "")) {
        return "The header has an empty column name. Use exactly: id, person, label.";
      }
      const counts = {};
      trimmed.forEach((h) => { counts[h] = (counts[h] || 0) + 1; });
      const dupes = Object.keys(counts).filter((h) => counts[h] > 1);
      if (dupes.length) {
        return `The header repeats ${dupes.map((h) => "“" + h + "”").join(", ")}. Each column name must appear once.`;
      }
      const missing = REQUIRED.filter((name) => !trimmed.includes(name));
      const extra = trimmed.filter((name) => !REQUIRED.includes(name));
      if (missing.length || extra.length) {
        const parts = [`The header must be exactly: id, person, label.`];
        if (missing.length) parts.push(`Missing: ${missing.join(", ")}.`);
        if (extra.length) parts.push(`Not allowed: ${extra.join(", ")}.`);
        parts.push(`Found: ${trimmed.filter(Boolean).join(", ") || "(empty header)"}.`);
        return parts.join(" ");
      }
      return "";
    }

    function validate(rows) {
      const errors = [];
      if (!rows.length) {
        return { errors: ["The table is empty. Paste a header and at least two people."] };
      }
      const headerMsg = headerError(rows[0]);
      if (headerMsg) return { errors: [headerMsg] };

      const header = rows[0].map((h) => h.trim());
      const index = Object.fromEntries(header.map((name, i) => [name, i]));
      const records = [];
      const seen = new Map();

      rows.slice(1).forEach((row, offset) => {
        const line = offset + 2;
        if (row.every((cell) => cell.trim() === "")) {
          errors.push(`Row ${line} is blank. Remove that row.`);
          return;
        }
        if (row.length !== header.length) {
          errors.push(`Row ${line} has ${row.length} columns. The header has ${header.length}: id, person, label.`);
          return;
        }
        const id = row[index.id].trim();
        const person = row[index.person].trim();
        const label = row[index.label].trim();
        if (!id) errors.push(`Row ${line}: id is empty.`);
        if (!person) errors.push(`Row ${line}: person is empty${id ? ` for id “${id}”` : ""}.`);
        if (!label) errors.push(`Row ${line}: label is empty${id ? ` for id “${id}”` : ""}.`);
        if (id && seen.has(id)) {
          errors.push(`Row ${line}: id “${id}” is already used on row ${seen.get(id)}.`);
        } else if (id) seen.set(id, line);
        if (id && person && label && !seen.has(id) || (id && person && label && seen.get(id) === line)) {
          records.push({ id, person, label });
        }
      });

      if (!records.length && !errors.length) {
        errors.push("The table has a header but no clip rows.");
      }

      const people = [...new Set(records.map((r) => r.person))].sort((a, b) =>
        a.localeCompare(b, undefined, { numeric: true })
      );
      if (!errors.length && records.length && people.length < 2) {
        const who = people.length === 1 ? ` (${people[0]})` : "";
        errors.push(`Found ${people.length} person${people.length === 1 ? "" : "s"}${who}. Leave-one-person-out needs at least two people.`);
      }

      return { errors, records, people };
    }

    function buildSplits(records, people) {
      const byPerson = {};
      people.forEach((person) => { byPerson[person] = []; });
      records.forEach((row) => byPerson[row.person].push(row.id));
      people.forEach((person) => {
        byPerson[person].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      });
      return people.map((person) => ({
        name: `left_out_${person}`,
        test_person: person,
        train_ids: people.filter((other) => other !== person).flatMap((other) => byPerson[other]),
        test_ids: byPerson[person].slice(),
      }));
    }

    function show(result) {
      resultEl.classList.remove("hidden");
      const check = document.getElementById("check");
      const errorList = document.getElementById("errors");
      const summary = document.getElementById("summary");
      const table = document.getElementById("fold-table");
      const body = document.getElementById("folds");
      errorList.innerHTML = "";
      body.innerHTML = "";
      lastJson = null;
      document.getElementById("download").disabled = true;

      if (result.errors.length) {
        summary.classList.add("hidden");
        table.classList.add("hidden");
        check.className = "bad";
        check.textContent = "No split file written.";
        result.errors.forEach((msg) => {
          const li = document.createElement("li");
          li.textContent = msg;
          errorList.appendChild(li);
        });
        return;
      }

      summary.classList.remove("hidden");
      table.classList.remove("hidden");
      document.getElementById("n-clips").textContent = String(result.records.length);
      document.getElementById("n-people").textContent = String(result.people.length);
      document.getElementById("n-splits").textContent = String(result.folds.length);
      check.className = "ok";
      check.textContent = "Checks passed. The same table always writes this file.";
      result.folds.forEach((fold) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${fold.test_person}</td><td class="num">${fold.train_ids.length}</td><td class="num">${fold.test_ids.length}</td>`;
        body.appendChild(tr);
      });
      lastJson = JSON.stringify(result.folds, null, 2) + "\n";
      document.getElementById("download").disabled = false;
    }

    function run() {
      const text = csvEl.value.trim();
      if (!text) {
        show({ errors: ["Paste a CSV first. The header must be: id, person, label."] });
        return;
      }
      const parsed = parseCSV(csvEl.value);
      if (parsed.error) {
        show({ errors: [parsed.error] });
        return;
      }
      const checked = validate(parsed.rows);
      if (checked.errors.length) {
        show(checked);
        return;
      }
      show({ ...checked, folds: buildSplits(checked.records, checked.people), errors: [] });
    }

    document.getElementById("example").addEventListener("click", () => {
      csvEl.value = EXAMPLE;
      run();
    });
    document.getElementById("run").addEventListener("click", run);
    csvEl.addEventListener("dragover", (e) => e.preventDefault());
    csvEl.addEventListener("drop", (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      const name = file.name.toLowerCase();
      if (!name.endsWith(".csv") && !name.endsWith(".txt")) {
        show({ errors: [`“${file.name}” is not a CSV. Drop a .csv file with the header id, person, label.`] });
        return;
      }
      file.text().then((text) => { csvEl.value = text; run(); }).catch(() => {
        show({ errors: [`Could not read “${file.name}”.`] });
      });
    });
    document.getElementById("download").addEventListener("click", () => {
      if (!lastJson) return;
      const blob = new Blob([lastJson], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "splits.json";
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
