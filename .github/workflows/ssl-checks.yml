name: SSL experiment checks
on:
  push:
    paths:
      - experiments/ssl/**
      - .github/workflows/ssl-checks.yml
  pull_request:
    paths:
      - experiments/ssl/**
      - .github/workflows/ssl-checks.yml
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: experiments/ssl/requirements.txt
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r experiments/ssl/requirements.txt
      - run: python -m compileall -q experiments/ssl
      - run: python -m unittest discover -s experiments/ssl/tests -v
